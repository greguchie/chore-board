openapi: 3.0.3
info:
  title: Chore Board API
  version: 2.0.0
  description: >
    REST API for chore-board: users, boards, board members and tasks.
    Most endpoints need a bearer access token from POST /auth/login.
    Board data is only visible to members of that board (others get 404),
    and some actions need the owner or admin role (others get 403).
    JSON bodies are limited to 10 KB, and requests are rate limited per IP.
servers:
  - url: http://localhost:3000
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Service status
  - name: Auth
    description: Log in, refresh tokens and log out
  - name: Users
    description: Sign up and manage your own account
  - name: Boards
    description: Chore boards you own or belong to
  - name: Members
    description: Who is on a board and their role
  - name: Tasks
    description: Chores on a board

paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Check that the API and database are running
      security: []
      responses:
        "200":
          description: Both are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  dbTime: { type: string, format: date-time }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in with email and password
      description: >
        Returns a 15-minute access token and a 30-day refresh token.
        An unknown email and a wrong password give the same 401.
        After 5 failed attempts in 15 minutes the IP address gets 429.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshTokens
      summary: Swap a refresh token for a new token pair
      description: >
        Each refresh token works once. The response contains a new access
        token and a new refresh token. Reusing an old refresh token is
        treated as theft and ends the whole session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: End the session that owns this refresh token
      description: >
        Always returns 204, whether or not the token was valid, so the
        response never reveals anything about the token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204":
          description: Logged out
        "400": { $ref: "#/components/responses/BadRequest" }

  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Sign up (create a user)
      description: Public. Limited to 10 sign-ups per hour per IP address.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /users/me:
    get:
      tags: [Users]
      operationId: getMe
      summary: Get your own profile
      responses:
        "200":
          description: Your profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      operationId: getUser
      summary: Get a user (your own account only)
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      operationId: updateUser
      summary: Update your own email or display name
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Users]
      operationId: deleteUser
      summary: Delete your own account
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /boards:
    get:
      tags: [Boards]
      operationId: listBoards
      summary: List the boards you belong to, with your role on each
      responses:
        "200":
          description: Your boards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Boards]
      operationId: createBoard
      summary: Create a board (you become its owner)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoard" }
      responses:
        "201":
          description: Board created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /boards/{id}:
    parameters:
      - $ref: "#/components/parameters/BoardIdAsId"
    get:
      tags: [Boards]
      operationId: getBoard
      summary: Get a board (any member)
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Boards]
      operationId: updateBoard
      summary: Rename or edit a board (owner or admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoard" }
      responses:
        "200":
          description: Updated board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Boards]
      operationId: deleteBoard
      summary: Delete a board and everything on it (owner only)
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /boards/{boardId}/members:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Members]
      operationId: listMembers
      summary: List the board's members (any member)
      responses:
        "200":
          description: Members of the board
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MemberListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Members]
      operationId: addMember
      summary: Add a member (owner or admin; only the owner can add admins)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMember" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /boards/{boardId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/MemberId"
    patch:
      tags: [Members]
      operationId: updateMemberRole
      summary: Change a member's role (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMember" }
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Members]
      operationId: removeMember
      summary: Remove a member, or leave the board yourself
      description: >
        The owner can remove anyone except themselves. Admins can remove
        plain members. Anyone except the owner can remove themselves
        (leave). The owner can't be removed; delete the board instead.
      responses:
        "204":
          description: Removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /boards/{boardId}/tasks:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List the board's tasks (any member)
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TaskStatus" }
        - name: assigneeId
          in: query
          required: false
          description: Membership id to filter by
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Tasks on the board
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task (any member)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTask" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }

  /boards/{boardId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task (any member)
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      operationId: updateTask
      summary: Update a task (any member)
      description: >
        Setting status to "done" records completedAt; moving it away
        from "done" clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTask" }
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete a task (owner or admin)
      responses:
        "204":
          description: Deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from POST /auth/login or /auth/refresh, valid for 15 minutes.

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: User id
      schema: { type: string, format: uuid }
    BoardIdAsId:
      name: id
      in: path
      required: true
      description: Board id
      schema: { type: string, format: uuid }
    BoardId:
      name: boardId
      in: path
      required: true
      description: Board id
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      description: Membership id (the "id" from the members list), not the user id
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      description: Task id
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid input or malformed JSON
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, invalid or expired token, or wrong login details
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Your account or board role doesn't allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (also returned for boards you aren't a member of)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicts with existing data (for example, an email already in use)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body is larger than 10 KB
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded; try again later
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, example: Invalid input }
        details:
          type: array
          description: Validation problems (only on some 400 responses)
          items: { type: object }

    Role:
      type: string
      enum: [owner, admin, member]

    TaskStatus:
      type: string
      enum: [todo, in_progress, done]

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }

    CreateUser:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, minLength: 8, maxLength: 128 }

    UpdateUser:
      type: object
      minProperties: 1
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 1, maxLength: 128 }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        accessTokenExpiresIn: { type: string, example: 15m }
        user: { $ref: "#/components/schemas/UserSummary" }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 200 }

    RefreshResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, example: Bearer }
        accessTokenExpiresIn: { type: string, example: 15m }

    Board:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        myRole:
          allOf:
            - $ref: "#/components/schemas/Role"
          description: Your role on this board (not included in PATCH responses)

    CreateBoard:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    UpdateBoard:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    Member:
      type: object
      properties:
        id: { type: string, format: uuid, description: Membership id }
        boardId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }

    MemberListItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: Membership id }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        joinedAt: { type: string, format: date-time }

    AddMember:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        role:
          type: string
          enum: [admin, member]
          default: member

    UpdateMember:
      type: object
      required: [role]
      properties:
        role:
          type: string
          enum: [admin, member]

    Task:
      type: object
      properties:
        id: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        assigneeId:
          type: string
          format: uuid
          nullable: true
          description: Membership id of the assignee
        dueDate: { type: string, format: date, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateTask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        assigneeId:
          type: string
          format: uuid
          description: Membership id of a member of this board
        dueDate: { type: string, format: date }

    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        status: { $ref: "#/components/schemas/TaskStatus" }
        assigneeId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date, nullable: true }