openapi: 3.0.3
info:
  title: Chore Board API
  version: 1.0.0
  description: >
    REST API for chore-board. Manage users, boards, board members and tasks.
    Authentication is added in a later phase, so every endpoint is currently open.
servers:
  - url: http://localhost:3000
    description: Local development
security: []
tags:
  - name: Health
  - name: Users
  - name: Boards
  - name: Members
  - name: Tasks
paths:
  /health:
    get:
      tags: [Health]
      summary: Check that the API and database are running
      responses:
        "200":
          description: Both are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  dbTime: { type: string, format: date-time }

  /users:
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUser" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Users]
      summary: List all users
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }

  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags: [Users]
      summary: Get one user
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Users]
      summary: Update a user
      description: Send only the fields to change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUser" }
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Users]
      summary: Delete a user
      description: Blocked with a 409 while the user still owns a board.
      responses:
        "204":
          description: User deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /boards:
    post:
      tags: [Boards]
      summary: Create a board
      description: Also adds the owner as a member with the owner role, in one transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBoard" }
      responses:
        "201":
          description: Board created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Boards]
      summary: List boards
      description: Returns every board, or only the boards a user belongs to when userId is given.
      parameters:
        - name: userId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The boards
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /boards/{boardId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    get:
      tags: [Boards]
      summary: Get one board
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Boards]
      summary: Update a board
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBoard" }
      responses:
        "200":
          description: The updated board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Board" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Boards]
      summary: Delete a board
      description: Also deletes the board's members and tasks.
      responses:
        "204":
          description: Board deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /boards/{boardId}/members:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [Members]
      summary: Add a user to a board
      description: The role can be admin or member. The owner is created with the board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMember" }
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      tags: [Members]
      summary: List a board's members
      responses:
        "200":
          description: The members, with each person's name and email
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/BoardMember" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /boards/{boardId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/MemberId"
    patch:
      tags: [Members]
      summary: Change a member's role
      description: The owner's role can't be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMember" }
      responses:
        "200":
          description: The updated member
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Member" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: [Members]
      summary: Remove a member from a board
      description: The owner can't be removed. Tasks assigned to the member stay and become unassigned.
      responses:
        "204":
          description: Member removed
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /boards/{boardId}/tasks:
    parameters:
      - $ref: "#/components/parameters/BoardId"
    post:
      tags: [Tasks]
      summary: Create a task
      description: The assignee, when given, must be a member of this board.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTask" }
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    get:
      tags: [Tasks]
      summary: List a board's tasks
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [todo, in_progress, done] }
        - name: assigneeId
          in: query
          description: A member id.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The tasks
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /boards/{boardId}/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/BoardId"
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      summary: Get one task
      responses:
        "200":
          description: The task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Tasks]
      summary: Update a task
      description: >
        Send only the fields to change. Send null for description, assigneeId or dueDate
        to clear them. Setting status to done fills in completedAt, and moving it back clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTask" }
      responses:
        "200":
          description: The updated task
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Tasks]
      summary: Delete a task
      responses:
        "204":
          description: Task deleted
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BoardId:
      name: boardId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MemberId:
      name: memberId
      in: path
      required: true
      description: A member id, not a user id.
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: The request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: The resource was not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: The request conflicts with existing data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details:
          type: array
          description: Validation problems, when there are any.
          items: { type: object }

    User:
      type: object
      required: [id, email, displayName, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateUser:
      type: object
      required: [email, displayName, password]
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    UpdateUser:
      type: object
      minProperties: 1
      properties:
        email: { type: string, format: email }
        displayName: { type: string, minLength: 1, maxLength: 100 }

    Board:
      type: object
      required: [id, name, description, ownerId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true }
        ownerId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateBoard:
      type: object
      required: [name, ownerId]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        ownerId: { type: string, format: uuid }
    UpdateBoard:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }

    Member:
      type: object
      required: [id, boardId, userId, role, joinedAt]
      properties:
        id: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        role: { type: string, enum: [owner, admin, member] }
        joinedAt: { type: string, format: date-time }
    BoardMember:
      type: object
      required: [id, userId, displayName, email, role, joinedAt]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        displayName: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [owner, admin, member] }
        joinedAt: { type: string, format: date-time }
    AddMember:
      type: object
      required: [userId]
      properties:
        userId: { type: string, format: uuid }
        role: { type: string, enum: [admin, member], default: member }
    UpdateMember:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [admin, member] }

    Task:
      type: object
      required: [id, boardId, title, description, status, assigneeId, dueDate, completedAt, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        boardId: { type: string, format: uuid }
        title: { type: string }
        description: { type: string, nullable: true }
        status: { type: string, enum: [todo, in_progress, done] }
        assigneeId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateTask:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        assigneeId: { type: string, format: uuid, description: A member id on this board. }
        dueDate: { type: string, format: date }
    UpdateTask:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000, nullable: true }
        status: { type: string, enum: [todo, in_progress, done] }
        assigneeId: { type: string, format: uuid, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
